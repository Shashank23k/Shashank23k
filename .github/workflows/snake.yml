name: Animate GitHub contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *' # daily, in UTC
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create light and dark animated snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shashank23k
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00B8D9&color_dots=#EBF4F8,#B3EAF2,#74D5E8,#2AA5C4,#176B91
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B29CFF&color_dots=#0D1117,#283248,#4E5681,#8472BE,#B29CFF

      - name: Publish the animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
